plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
    id "org.jetbrains.kotlin.plugin.compose"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}


android {
    namespace = "com.vinhnt.meow_app"
    compileSdk = 36
    ndkVersion = "29.0.14206865"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.vinhnt.meow_app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 24
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        ndk { abiFilters "armeabi-v7a", "arm64-v8a", "x86_64" }
    }

    signingConfigs {
        release {
            if (System.getenv("KEYSTORE_BASE64") != null) {
                println("INFO: founded keys <3")

                def keystoreBytes = System.getenv("KEYSTORE_BASE64").decodeBase64()
                def keystoreFile = rootProject.file("build/ci_keystore.jks") 
                keystoreFile.bytes = keystoreBytes

                storeFile = keystoreFile
                storePassword = System.getenv("KEYSTORE_PASSWORD")
                keyAlias = System.getenv("KEY_ALIAS")
                keyPassword = System.getenv("KEY_PASSWORD")
            } else {
                def props = new Properties()
                def keyPropFile = rootProject.file("key.properties")

                if (keyPropFile.exists()) {
                    props.load(new FileInputStream(keyPropFile))

                    storeFile = file(props['storeFile'])
                    storePassword = props['storePassword']
                    keyAlias = props['keyAlias']
                    keyPassword = props['keyPassword']
                } else {
                    println("WARNING: key.properties not found. Signing skipped.")
                }
            }
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding true
        compose true
    }
}

kotlin {
    jvmToolchain {
        languageVersion.set(JavaLanguageVersion.of(17))
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation 'com.squareup.picasso:picasso:2.71828' // Use the latest version available
    implementation platform('com.google.firebase:firebase-bom:34.2.0')
    implementation 'com.google.firebase:firebase-analytics'
    def objectboxVersion = "4.1.0"
    debugImplementation("io.objectbox:objectbox-android-objectbrowser:$objectboxVersion")
    releaseImplementation("io.objectbox:objectbox-android:$objectboxVersion")
    implementation 'androidx.glance:glance-appwidget:1.0.0'
    implementation("io.coil-kt:coil-compose:2.6.0")
}

configurations {
    all {
        exclude group: 'androidx.work', module: 'work-runtime-ktx'
    }
    debugImplementation {
        exclude group: 'io.objectbox', module: 'objectbox-android'
    }
}
