name: meow_app
description: A new Flutter project.
authors:
  - vinh ngo tan

version: 1.6.0+8

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: 3.24.5 #The version of Flutter used in this project.

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  equatable: ^2.0.7
  easy_localization: ^3.0.7+1
  flutter_bloc: ^9.0.0
  get_it: ^8.0.3
  dio: ^5.8.0+1
  just_audio: ^0.10.4
  just_audio_background: ^0.0.1-beta.11
  audio_session: ^0.2.2
  photo_view: ^0.15.0
  page_transition: ^2.2.1
  #  image_downloader: ^0.31.0
  permission_handler: any
  connectivity_plus: ^6.1.3
  shared_preferences: ^2.5.1
  flutter_native_splash: ^2.4.4
  share_plus: ^11.1.0
  path_provider: ^2.1.5
  package_info_plus: ^8.2.1
  cupertino_icons: ^1.0.8
  crop_image: ^1.0.15
  image: any
  confetti: ^0.8.0
  image_picker: ^1.1.2
  hugeicons: ^0.0.7
  dropdown_button2: ^2.3.9
  flutter_svg: ^2.0.17
  hero_animation: ^1.1.4
  curl_logger_dio_interceptor: ^1.0.0 # Logs Dio HTTP requests in a cURL-like format for easier debugging.
  url_launcher: ^6.3.1
  shimmer: ^3.0.0
  appinio_social_share: 0.3.2
  device_info_plus: ^11.3.0
  cr_file_saver: ^0.0.2
  country_flags: ^3.2.0
  google_fonts: ^6.2.1
  showcaseview: ^4.0.1
  lottie: ^3.0.0
  intl: ^0.20.2
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  home_widget: ^0.8.0
  workmanager: ^0.9.0+3
  firebase_core: ^4.1.0
  firebase_crashlytics: ^5.0.1
  app_links: any
  in_app_review: ^2.0.10
  flip_card: any
  dotted_border: ^3.1.0
  google_mlkit_subject_segmentation: ^0.0.2
  google_mlkit_commons: ^0.11.0
  flutter_image_compress: ^2.4.0
  objectbox: 4.1.0
  objectbox_flutter_libs: 4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.8
  objectbox_generator: 4.1.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/locales/
    - assets/icon/
    - assets/animations/
    - assets/sounds/

flutter_native_splash:
  color: "#FF6F7F"
  image: images/icon_200.png
  color_dark: "#FF6F7F"
  image_dark: images/icon_200.png

  fullscreen: true

  android_12:
    image: images/icon_adr12.png
    icon_background_color: "#FF6F7F"
    image_dark: images/icon_adr12.png
    icon_background_color_dark: "#FF6F7F"

  android_gravity: center
  ios_content_mode: center

  android: true
  ios: true
  web: false
