name: Deploy to Google Play

on:
  push:
    branches:
      - meow-app-v2

jobs:
  build:
    name: Build & Deploy to Play Store
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch full history and tags

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.4'

      - name: Install dependencies
        run: flutter pub get

      - name: Auto set version in pubspec.yaml
        id: versioning
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          GIT_TAG=$(git describe --tags --abbrev=0 || echo "0.0.0")
          VERSION_NAME="$GIT_TAG+$COMMIT_COUNT"

          echo "🔖 Version set to $VERSION_NAME"
          sed -i "s/^version: .*/version: $VERSION_NAME/" pubspec.yaml

          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      - name: Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Decode google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES }}" | base64 --decode > android/app/google-services.json

      - name: Decode Keystore
        run: |
          mkdir -p android/build
          echo "$KEYSTORE_BASE64" | base64 --decode > android/build/ci_keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build release AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Install Fastlane
        run: gem install fastlane

      - name: Create credentials file
        run: |
          mkdir -p android/fastlane
          printf '%s' "$GOOGLE_PLAY_CREDENTIALS" > android/fastlane/credentials.json
        env:
          GOOGLE_PLAY_CREDENTIALS: ${{ secrets.GOOGLE_PLAY_CREDENTIALS }}

      - name: Deploy using Fastlane
        working-directory: android
        run: |
          fastlane supply \
            --json_key fastlane/credentials.json \
            --package_name com.vinhnt.meow_app \
            --aab ../build/app/outputs/bundle/release/app-release.aab \
            --track internal

      - name: Tag Git with version
        if: github.ref == 'refs/heads/meow-app-v2'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag v${{ env.VERSION_NAME }}
          git push origin v${{ env.VERSION_NAME }}
